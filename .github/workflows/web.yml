name: Web build

# Builds the port for the web (zig compiles, Emscripten links; see docs/port/web.md).
# Cloudflare Pages publishes master through its Git integration.

on:
  push:
    branches: [master]
    paths: ['port/**', 'src/**', 'config/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['port/**', 'src/**', 'config/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache
      - name: Build
        working-directory: port
        run: zig build harvest -Dtarget=wasm32-emscripten -Doptimize=ReleaseFast -p zig-out/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harvest-web
          path: port/zig-out/web
