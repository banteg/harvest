# Port-relevance layers for the progress report. Every FDE function gets one layer, shown as its own
# decomp.dev category next to the whole-binary numbers.
#
# A function's layer is the first `rule` whose pattern matches its symbol name (searched in the mangled
# name), else the layer of the closest named function before it in the same `range`, else the range's
# layer. The ranges follow the link order: the game objects, then the daisy engine (Irrlicht 0.7
# derived), then the ox library.
#
# `copies` match the template and inline code a unit emits beside its own: STL instantiations and
# ox interface inlines. A copy takes a rule's layer when one matches, else the layer of the code around
# it, and never becomes the layer that later unnamed functions inherit.
copies = ['^_ZN?K?(St|9__gnu_cxx)', '^_ZNK?2ox', '^T\.\d+$']

[layers.game]
name = "Game logic (harvest)"

[layers.engine]
name = "Engine core a port keeps (ox, sprite/particle packages, fonts, sound, VFS, null driver)"

[layers.toolkit]
name = "GUI toolkit widgets (daisy::gui)"

[layers.platform]
name = "Platform layer a port replaces (OpenGL/software renderers, scene graph, X11/OpenAL/SFML backends)"

[[range]]
layer = "game"
start = 0x408740
end = 0x4bacc0

[[range]]
layer = "platform"
start = 0x4bacc0
end = 0x5db100

[[range]]
layer = "engine"
start = 0x5db100
end = 0x5eedd8

# Portable daisy subsystems and data formats the port keeps inside the daisy range: the sprite and
# particle packages with their records, the null video driver/color converter/FPS counter/video-mode
# list, the VFS and zip reader, the device stub/logger/timer/os helpers, the null joystick driver,
# the menu scene's recovered nodes/rotation animator, the fonts, and CAudioDriver with its info stubs.
[[rule]]
layer = "engine"
pattern = '5daisy5video\d+(CSprite|CParticle|SSprite|SAnimation|SImage|SParticle|CVideoNull|createNullDriver|CColorConverter|CFPSCounter|CVideoModeList)'

[[rule]]
layer = "engine"
pattern = '5daisy2io\d+(CFileList|CFileSystem|createFileSystem|CFilePath|CLimitReadFile|createLimitReadFile|CMemoryReadFile|createMemoryReadFile|CReadFile|createReadFile|CWriteFile|createWriteFile|CZipFileList|CZipReader|SZipFileEntry)'

[[rule]]
layer = "engine"
pattern = '5daisy(\d+(CIrrDeviceStub|IDaisyDevice|ITimer|CTimer|CLogger)|2os\d+(Printer|Timer|Byteswap))'

[[rule]]
layer = "engine"
pattern = '5daisy5input19CJoystickNullDriver'

[[rule]]
layer = "engine"
pattern = '5daisy5scene\d+(CBillboardSceneNode|CLightSceneNode|CSkyBoxSceneNode|CSceneNodeAnimatorRotation)'

[[rule]]
layer = "engine"
pattern = '5daisy3gui(8CGUIFont|12CUnicodeFont)'

[[rule]]
layer = "engine"
pattern = '5daisy5audio\d+(CAudioDriver|C[A-Za-z]+InfoStub)'

[[rule]]
layer = "toolkit"
pattern = '5daisy3gui'

# The ox library's interfaces, wherever their inline bodies are emitted.
[[rule]]
layer = "engine"
pattern = '^_ZNK?2ox'
