<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvest: Massive Encounter</title>
<link rel="preload" href="assets/cd-rom.webp" as="image">
<style>
  :root { color-scheme: dark; --bg: #07090c; --dim: #6b7884; --glow: #ff8a2a; }
  html, body { margin: 0; height: 100%; color: #c8d3dc; font: 14px/1.5 system-ui, sans-serif; }
  body { background: radial-gradient(ellipse at 50% 60%, #121820 0%, var(--bg) 70%) var(--bg); }
  #canvas { display: block; outline: none; }

  #setup { min-height: 100%; box-sizing: border-box; padding: 24px 16px;
    display: flex; align-items: center; justify-content: center; gap: clamp(16px, 4vw, 56px);
    transition: opacity .6s ease, transform .6s ease; }
  @media (max-width: 860px) { #setup { flex-direction: column; } .flow-wrap { margin-bottom: 2.75rem; } }

  .flow-wrap { position: relative; width: min(640px, 100%); line-height: 0; transition: opacity .4s; }
  #flow { width: 100%; height: auto; }
  /* the Steam window half of the picture opens Harvest in the Steam library */
  #steam { position: absolute; left: 2%; top: 9%; width: 44%; height: 80%; border-radius: 16px; }
  #steam:hover { box-shadow: 0 0 0 2px rgb(127 196 255 / .5); }
  #open-steam { position: absolute; left: 24%; top: 100%; transform: translate(-50%, 6px);
    line-height: 1.5; white-space: nowrap; padding: .3rem .85rem; border-radius: 999px;
    color: #c8d3dc; text-decoration: none; background: #10161d; border: 1px solid #2a3540; }
  #open-steam:hover { color: #fff; border-color: #4b8fd0; }

  #drive { position: relative; width: min(320px, 70vw); aspect-ratio: 1; flex: none; cursor: pointer;
    border-radius: 50%; outline: none; }
  #disc { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%;
    filter: grayscale(1) brightness(.42) contrast(.95); opacity: .85;
    transition: filter .5s ease, opacity .5s ease, box-shadow .5s ease;
    animation: idle 3.2s ease-in-out infinite; }
  @keyframes idle { 50% { filter: grayscale(1) brightness(.55) contrast(.95); } }
  #drive:hover #disc, body.over #disc { filter: grayscale(.4) brightness(.8); opacity: 1; animation: none; }
  body.over #disc { box-shadow: 0 0 60px rgb(255 138 42 / .35); }
  body.loading #disc, body.ready #disc, body.playing #disc {
    filter: none; opacity: 1; animation: none; box-shadow: 0 0 70px rgb(255 138 42 / .28); }
  body.ready #drive:hover #disc { box-shadow: 0 0 90px rgb(255 138 42 / .5); }

  #ring { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px);
    transform: rotate(-90deg); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #ring circle { fill: none; stroke: var(--glow); stroke-width: 1.2; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .2s linear; }
  body.loading #ring { opacity: .9; }

  #eject { position: absolute; right: 2%; bottom: 2%; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid #2a3540; background: #10161d; color: var(--dim); font-size: 15px; cursor: pointer;
    display: none; padding: 0; }
  #eject:hover { color: #c8d3dc; }
  body.ready #eject { display: block; }

  #note { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; color: var(--dim); margin: 0; }

  body.ready .flow-wrap, body.playing .flow-wrap { display: none; }
  body.loading .flow-wrap { opacity: .2; }
  body.playing #setup { opacity: 0; transform: scale(1.06); }
  body.error #drive { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .hidden { display: none !important; }
  .message { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgb(0 0 0 / .6); }
  .message div { max-width: 30rem; margin: 16px; padding: 1.25rem 1.5rem; border-radius: 8px;
    background: #10161d; border: 1px solid #2a3540; white-space: pre-wrap; }
  .message h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
  .message button { font: inherit; padding: .4rem 1rem; }
</style>
</head>
<body class="empty">
<main id="setup">
  <div class="flow-wrap">
    <img id="flow" src="assets/load-flow.webp" width="1400" height="569"
         alt="In Steam, right-click Harvest, Manage, Browse local files; then drag Harvest Steam.app onto the disc">
    <a id="steam" href="steam://nav/games/details/15400" title="Open Harvest in Steam"></a>
    <a id="open-steam" href="steam://nav/games/details/15400">Open in Steam</a>
  </div>
  <div id="drive" role="button" tabindex="0" title="Drop the game (its folder or a zip of it) here, or click to choose its folder">
    <img id="disc" src="assets/cd-rom.webp" alt="">
    <svg id="ring" viewBox="-1 -1 102 102"><circle cx="50" cy="50" r="50" pathLength="100"/></svg>
    <button id="eject" title="Eject (forget the game data)">&#x23CF;</button>
  </div>
  <input id="picker" type="file" webkitdirectory class="hidden">
</main>
<p id="note"></p>
<canvas id="canvas" class="hidden" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<script>
"use strict";
// Both folders live in IndexedDB (Emscripten's IDBFS): /data holds the player's harvestClientData,
// /libsdl the user data folder SDL picks on the web (/libsdl/Harvest: settings, profiles, saves).
const DATA_ROOT = "/data";
const USER_ROOT = "/libsdl";
const CLIENT_DATA = "harvestClientData";

const $ = (id) => document.getElementById(id);
const note = (text) => { $("note").textContent = text || ""; };
const setState = (s) => { document.body.className = s; };
const state = () => document.body.className;

let storageReady = false;
let started = false;

var Module = {
  canvas: $("canvas"),
  print: (text) => console.log(text),
  printErr: (text) => console.warn(text),
  onRuntimeInitialized() { openStorage(); },
  showGameMessage(title, text) {
    const box = document.createElement("div");
    box.className = "message";
    box.innerHTML = "<div><h2></h2><p></p><button>OK</button></div>";
    box.querySelector("h2").textContent = title;
    box.querySelector("p").textContent = text;
    box.querySelector("button").onclick = () => box.remove();
    document.body.appendChild(box);
  },
};

// ---- the disc ----

// Spins the disc up to speed and down again, like a drive, by advancing its angle every frame.
let angle = 0, speed = 0, targetSpeed = 0, lastFrame = 0, spinning = false;
function spinFrame(now) {
  const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  speed += (targetSpeed - speed) * Math.min(1, dt * 1.5);
  angle = (angle + speed * dt) % 360;
  $("disc").style.transform = `rotate(${angle}deg)`;
  if (targetSpeed > 0 || speed > 1) requestAnimationFrame(spinFrame);
  else { spinning = false; lastFrame = 0; }
}
function spin(degreesPerSecond) {
  targetSpeed = degreesPerSecond;
  if (!spinning && degreesPerSecond > 0) { spinning = true; requestAnimationFrame(spinFrame); }
}
function progress(fraction) {
  $("ring").querySelector("circle").style.strokeDashoffset = String(100 - 100 * fraction);
}
function fail(text) {
  spin(0);
  setState("error");
  note(text);
  setTimeout(() => { if (state() === "error") setState(haveData() ? "ready" : "empty"); }, 600);
}

// ---- storage ----

function mountOf(path) { return Module.FS.lookupPath(path).node.mount; }

// Syncs one IDBFS mount: populate=true loads IndexedDB into memory, false writes memory back.
function sync(path, populate) {
  return new Promise((ok, no) => Module.FS.filesystems.IDBFS.syncfs(mountOf(path), populate,
    (err) => err ? no(err) : ok()));
}

function exists(path) {
  try { Module.FS.stat(path); return true; } catch { return false; }
}
const haveData = () => storageReady && exists(`${DATA_ROOT}/${CLIENT_DATA}`);

function removeTree(path) {
  const FS = Module.FS;
  if (!exists(path)) return;
  if (FS.isDir(FS.stat(path).mode)) {
    for (const name of FS.readdir(path))
      if (name !== "." && name !== "..") removeTree(path + "/" + name);
    FS.rmdir(path);
  } else {
    FS.unlink(path);
  }
}

let pending = null; // data given before the storage was open

async function openStorage() {
  const FS = Module.FS;
  for (const root of [DATA_ROOT, USER_ROOT]) {
    FS.mkdir(root);
    FS.mount(FS.filesystems.IDBFS, {}, root);
  }
  try {
    await Promise.all([sync(DATA_ROOT, true), sync(USER_ROOT, true)]);
  } catch (err) {
    console.warn("cannot read the browser's storage:", err);
  }
  storageReady = true;
  if (pending) { const entries = pending; pending = null; accept(entries); }
  else if (haveData()) setState("ready");
  else loadData();
}

// Writes the user data folder back now and then while the game runs, and when the page goes away.
let userSync = null;
function saveUserData() {
  if (!started || userSync) return;
  userSync = sync(USER_ROOT, false).catch((err) => console.warn("cannot save the user data:", err))
    .finally(() => { userSync = null; });
}
setInterval(saveUserData, 3000);
addEventListener("pagehide", saveUserData);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveUserData(); });

// ---- taking the player's data ----

// The path from harvestClientData/ on, or null for files outside it.
function clientDataPath(path) {
  const parts = path.split("/").filter(Boolean);
  const at = parts.indexOf(CLIENT_DATA);
  return at < 0 ? null : parts.slice(at).join("/");
}

// ---- zip files ----

// A zip given instead of a folder (a zipped install, Harvest Steam.app or harvestClientData) is read
// here: its central directory lists the entries, and DecompressionStream inflates them. Zips inside
// harvestClientData are the game's own mods and stay as they are.
const isOuterZip = (e) => /\.zip$/i.test(e.path) && clientDataPath(e.path) === null;

async function expandZips(entries) {
  const out = [];
  for (const e of entries) {
    if (isOuterZip(e)) out.push(...zipEntries(await e.read()));
    else out.push(e);
  }
  return out;
}

function zipEntries(buffer) {
  const view = new DataView(buffer);
  const u16 = (at) => view.getUint16(at, true);
  const u32 = (at) => view.getUint32(at, true);
  // The end of central directory record, within the last 64 KB (its comment can be that long).
  let end = -1;
  for (let at = buffer.byteLength - 22; at >= Math.max(0, buffer.byteLength - 65557); at--)
    if (u32(at) === 0x06054b50) { end = at; break; }
  if (end < 0) throw new Error("not a zip file");
  const count = u16(end + 10);
  let at = u32(end + 16);
  if (at === 0xffffffff) throw new Error("zip64 archives are not supported");
  const utf8 = new TextDecoder();
  const entries = [];
  for (let i = 0; i < count; i++) {
    if (u32(at) !== 0x02014b50) throw new Error("damaged central directory");
    const method = u16(at + 10);
    const size = u32(at + 20);
    const nameLength = u16(at + 28);
    const local = u32(at + 42);
    const path = utf8.decode(new Uint8Array(buffer, at + 46, nameLength));
    at += 46 + nameLength + u16(at + 30) + u16(at + 32);
    if (path.endsWith("/") || path.startsWith("__MACOSX/")) continue;
    if (method !== 0 && method !== 8) throw new Error(`${path} uses compression method ${method}`);
    const data = local + 30 + u16(local + 26) + u16(local + 28);
    const bytes = new Uint8Array(buffer, data, size);
    entries.push({
      path,
      read: () => method === 0 ? Promise.resolve(bytes.slice().buffer)
        : new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer(),
    });
  }
  return entries;
}

async function accept(entries) {
  // entries: [{ path, read: () => Promise<ArrayBuffer> }]
  if (!storageReady) { pending = entries; setState("loading"); spin(240); return; }
  try { entries = await expandZips(entries); }
  catch (err) { return fail(`Cannot read that zip: ${err.message || err}`); }
  const wanted = entries
    .map((e) => ({ ...e, path: clientDataPath(e.path) }))
    .filter((e) => e.path && !e.path.split("/").some((p) => p.startsWith(".")));
  if (!wanted.length) return fail("No Harvest data in that.");

  note("");
  setState("loading");
  progress(0);
  spin(540);
  const begun = performance.now();
  const FS = Module.FS;
  removeTree(`${DATA_ROOT}/${CLIENT_DATA}`);
  for (let i = 0; i < wanted.length; i++) {
    const data = new Uint8Array(await wanted[i].read());
    const path = `${DATA_ROOT}/${wanted[i].path}`;
    FS.mkdirTree(path.slice(0, path.lastIndexOf("/")));
    FS.writeFile(path, data);
    progress((i + 1) / wanted.length);
  }
  // Keep it for next time, in the background, and ask the browser not to evict it.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  sync(DATA_ROOT, false).catch((err) => console.warn("cannot keep the game data:", err));

  // Let the disc get up to speed before the game takes over.
  setTimeout(play, Math.max(0, 1400 - (performance.now() - begun)));
}

function play() {
  if (started || !haveData()) return;
  started = true;
  spin(1080);
  setState("playing");
  setTimeout(() => {
    spin(0);
    $("setup").classList.add("hidden");
    $("canvas").classList.remove("hidden");
    $("canvas").focus();
    Module.callMain(["--data", DATA_ROOT]);
  }, 650);
}

// Clicking the disc: play when there is data, else choose the folder.
$("drive").onclick = (e) => {
  if (e.target === $("eject")) return;
  if (state() === "ready") play();
  else if (state() === "empty") $("picker").click();
};
$("drive").onkeydown = (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("drive").click(); }
};
$("picker").onchange = () => accept([...$("picker").files].map((f) => ({
  path: f.webkitRelativePath, read: () => f.arrayBuffer(),
})));

$("eject").onclick = () => {
  removeTree(`${DATA_ROOT}/${CLIENT_DATA}`);
  sync(DATA_ROOT, false);
  setState("empty");
};

// Drag and drop anywhere on the page, walking dropped directories (an .app is one).
async function walk(entry, out) {
  if (entry.isFile) {
    out.push({ path: entry.fullPath, read: () => new Promise((ok, no) =>
      entry.file((f) => f.arrayBuffer().then(ok, no), no)) });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
      if (!batch.length) break;
      for (const child of batch) await walk(child, out);
    }
  }
}
let dragDepth = 0;
let stateBeforeDrag = "empty";
const droppable = () => !started && ["empty", "ready", "over"].includes(state());
addEventListener("dragenter", (e) => {
  if (!droppable()) return;
  e.preventDefault();
  if (dragDepth++ === 0) { stateBeforeDrag = state(); setState("over"); }
});
addEventListener("dragover", (e) => { if (droppable()) e.preventDefault(); });
addEventListener("dragleave", () => {
  if (state() === "over" && --dragDepth === 0) setState(stateBeforeDrag);
});
addEventListener("drop", async (e) => {
  if (!droppable()) return;
  e.preventDefault();
  dragDepth = 0;
  // The entries have to be taken while the event lasts.
  const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  setState("loading");
  spin(240);
  const out = [];
  for (const entry of entries) await walk(entry, out);
  accept(out);
});

// With no data stored, load the public copy. ?data=<url> still overrides that on a local server
// (a folder via <url>/manifest.json, or a zip when <url> ends in .zip), so a link to the published
// page cannot point the game at someone else's copy.
const DEFAULT_DATA = "/harvestClientData.zip";
const LOCAL_HOSTS = ["localhost", "127.0.0.1", "[::1]"];
async function downloadData(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(response.status + " " + response.statusText);
  const total = Number(response.headers.get("Content-Length"));
  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.byteLength;
    if (total > 0) progress(received / total);
    note(`Downloading game data: ${(received / 1048576).toFixed(1)} MB${total > 0 ? ` / ${(total / 1048576).toFixed(1)} MB` : ""}`);
  }
  return new Blob(chunks).arrayBuffer();
}
function loadData() {
  const query = new URLSearchParams(location.search).get("data");
  const dataUrl = query && LOCAL_HOSTS.includes(location.hostname) ? query : DEFAULT_DATA;
  setState("loading");
  progress(0);
  spin(240);
  note("Downloading game data…");
  if (/\.zip$/i.test(dataUrl)) {
    accept([{ path: dataUrl, read: () => downloadData(dataUrl) }])
      .catch((err) => fail("Cannot fetch the data: " + (err.message || err)));
    return;
  }
  const base = dataUrl.endsWith("/") ? dataUrl : dataUrl + "/";
  fetch(base + "manifest.json").then((r) => r.json()).then((paths) => accept(paths.map((p) => ({
    path: p, read: () => fetch(base + p.split("/").map(encodeURIComponent).join("/")).then((r) => r.arrayBuffer()),
  })))).catch((err) => fail("Cannot fetch the data: " + err));
}
</script>
<script async src="harvest.js"></script>
</body>
</html>
